<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starlink Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #060a12; --surface: #0d1520; --surface2: #111d2e; --border: rgba(255,255,255,0.06);
            --border-bright: rgba(56,189,248,0.3); --text: #e2e8f0; --muted: #4a6080;
            --accent: #38bdf8; --accent2: #0ea5e9; --accent-glow: rgba(56,189,248,0.15);
            --danger: #f87171; --success: #34d399; --warn: #fbbf24;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Space Grotesk', sans-serif; min-height: 100vh; }
        body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(14,165,233,0.12) 0%, transparent 60%); z-index: 0; pointer-events: none; }
        header { border-bottom: 1px solid var(--border); background: rgba(6,10,18,0.8); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 100; padding: 0 2rem; height: 64px; display: flex; align-items: center; justify-content: space-between; }
        .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; text-transform: uppercase; }
        .logo-icon { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, var(--accent2), #0369a1); display: grid; place-items: center; }
        .sync-btn { border: 1px solid var(--border-bright); color: var(--accent); padding: 8px 20px; border-radius: 8px; font-weight: 600; transition: all 0.2s; }
        .sync-btn:hover { background: var(--accent-glow); box-shadow: 0 0 20px rgba(56,189,248,0.15); }
        .summary-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1px; background: var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 2rem; }
        .summary-stat { background: var(--surface); padding: 1.2rem 1.5rem; }
        .label { font-size: 0.7rem; font-family: 'JetBrains Mono'; color: var(--muted); text-transform: uppercase; }
        .value { font-size: 1.5rem; font-weight: 700; }
        .overview-card, .table-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; margin-bottom: 2rem; }
        .table-container { max-height: 400px; overflow-y: auto; border-radius: 8px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; font-family: 'JetBrains Mono'; font-size: 0.85rem; }
        th { background: var(--surface2); color: var(--muted); padding: 12px; text-align: left; position: sticky; top: 0; }
        td { padding: 12px; border-bottom: 1px solid var(--border); }
        tr:hover { background: rgba(56,189,248,0.03); }
    </style>
</head>
<body class="p-0">
    <header>
        <div class="logo"><div class="logo-icon">🛰</div>Starlink <span class="text-sky-400">&nbsp;Analytics</span></div>
        <div class="flex items-center gap-4">
            <div id="statusDot" class="w-2 h-2 rounded-full bg-slate-600"></div>
            <span id="statusLabel" class="text-xs font-mono text-slate-500 uppercase">Idle</span>
            <button id="syncBtn" class="sync-btn" onclick="startScrape()">Sync Live Data</button>
        </div>
    </header>

    <main class="p-8 max-w-7xl mx-auto relative z-10">
        <div class="summary-bar" id="summaryBar" style="display:none">
            <div class="summary-stat"><div class="label">Total Cycles</div><div class="value" id="statCycles">—</div></div>
            <div class="summary-stat"><div class="label">Total Usage</div><div class="value text-sky-400" id="statTotal">—</div></div>
            <div class="summary-stat"><div class="label">Avg/Cycle</div><div class="value" id="statAvg">—</div></div>
            <div class="summary-stat"><div class="label">Last Sync</div><div class="value text-sm" id="statSynced">—</div></div>
        </div>

        <div class="overview-card" id="overviewCard" style="display:none">
            <div class="flex justify-between items-center mb-4">
                <span class="label">Usage Trend — Monthly Overview</span>
                <a href="/api/download" class="text-xs font-mono text-sky-400 hover:underline">Export CSV</a>
            </div>
            <canvas id="overviewChart" height="100"></canvas>
        </div>

        <!-- NEW: DAILY LOGS TABLE -->
        <div class="table-card" id="tableCard" style="display:none">
            <div class="label mb-4">Detailed Daily Logs</div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr><th>Date</th><th>Usage</th><th>Status</th></tr>
                    </thead>
                    <tbody id="dailyTableBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const MONTHLY_LIMIT = 500;
        let overviewChart = null;

        fetch('/api/data').then(r => r.json()).then(d => { if (d.length) renderAll(d); });

        function startScrape() {
            const btn = document.getElementById('syncBtn');
            btn.disabled = true; btn.textContent = 'Syncing...';
            fetch('/api/scrape', { method: 'POST' }).then(r => r.json()).then(res => {
                if (res.data) { renderAll(res.data); }
                location.reload(); // Reload to refresh everything
            }).finally(() => { btn.disabled = false; btn.textContent = 'Sync Live Data'; });
        }

        function renderAll(data) {
            document.getElementById('summaryBar').style.display = 'grid';
            document.getElementById('overviewCard').style.display = 'block';
            document.getElementById('tableCard').style.display = 'block';
            
            const monthly = groupByMonth(data);
            renderSummary(monthly, data);
            renderChart(monthly);
            renderDailyTable(data);
        }

        function groupByMonth(data) {
            const months = {};
            data.forEach(d => {
                const date = new Date(d.date);
                const key = date.toLocaleString('en-US', { month: 'long', year: 'numeric' });
                if (!months[key]) months[key] = { date: key, total: 0 };
                months[key].total += parseFloat(d.data_usage_gb) || 0;
            });
            return Object.values(months);
        }

        function renderSummary(monthly, daily) {
            const total = daily.reduce((a, b) => a + (parseFloat(b.data_usage_gb) || 0), 0);
            document.getElementById('statCycles').textContent = monthly.length;
            document.getElementById('statTotal').textContent = total.toFixed(1) + ' GB';
            document.getElementById('statAvg').textContent = (total / monthly.length).toFixed(1) + ' GB';
            document.getElementById('statSynced').textContent = new Date().toLocaleTimeString();
        }

        function renderChart(monthly) {
            const ctx = document.getElementById('overviewChart').getContext('2d');
            if (overviewChart) overviewChart.destroy();
            overviewChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: monthly.map(m => m.date),
                    datasets: [{
                        label: 'GB Used',
                        data: monthly.map(m => m.total),
                        backgroundColor: '#38bdf8', borderRadius: 5
                    }]
                },
                options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
            });
        }

        function renderDailyTable(data) {
            const tbody = document.getElementById('dailyTableBody');
            tbody.innerHTML = '';
            // I-sort natin para pinakabago ang nasa taas
            const sorted = [...data].reverse();
            sorted.forEach(row => {
                const tr = document.createElement('tr');
                const gb = parseFloat(row.data_usage_gb) || 0;
                const statusColor = gb > 20 ? 'text-rose-400' : gb > 10 ? 'text-amber-400' : 'text-emerald-400';
                tr.innerHTML = `
                    <td class="text-slate-300">${row.date}</td>
                    <td class="font-bold ${statusColor}">${gb.toFixed(2)} GB</td>
                    <td class="text-[10px] uppercase opacity-50">${gb > 15 ? 'High' : 'Normal'}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
