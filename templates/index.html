<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starlink Data Scraper</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #060d1f;
            --surface: #0d1b35;
            --border: #1a2d50;
            --accent: #00c8ff;
            --accent2: #7c3aed;
            --text: #e2eaf5;
            --muted: #6b82a8;
            --success: #10b981;
            --error: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 0;
            overflow-x: hidden;
        }

        /* Starfield background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.6) 0%, transparent 100%),
                radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.4) 0%, transparent 100%),
                radial-gradient(1px 1px at 50% 10%, rgba(255,255,255,0.5) 0%, transparent 100%),
                radial-gradient(1px 1px at 70% 80%, rgba(255,255,255,0.3) 0%, transparent 100%),
                radial-gradient(1px 1px at 90% 40%, rgba(255,255,255,0.6) 0%, transparent 100%),
                radial-gradient(1px 1px at 20% 90%, rgba(255,255,255,0.4) 0%, transparent 100%),
                radial-gradient(1px 1px at 80% 15%, rgba(255,255,255,0.5) 0%, transparent 100%),
                radial-gradient(1px 1px at 40% 45%, rgba(255,255,255,0.3) 0%, transparent 100%),
                radial-gradient(1px 1px at 60% 70%, rgba(255,255,255,0.4) 0%, transparent 100%),
                radial-gradient(1px 1px at 15% 55%, rgba(255,255,255,0.5) 0%, transparent 100%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 960px;
            margin: 0 auto;
            padding: 48px 24px;
        }

        header {
            text-align: center;
            margin-bottom: 48px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 12px;
        }

        .satellite-icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            box-shadow: 0 0 32px rgba(0, 200, 255, 0.3);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 32px rgba(0, 200, 255, 0.3); }
            50% { box-shadow: 0 0 48px rgba(0, 200, 255, 0.6); }
        }

        h1 {
            font-family: 'Space Mono', monospace;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--muted);
            font-size: 0.95rem;
            margin-top: 8px;
            font-weight: 300;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 24px;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 10px;
            border: none;
            font-size: 0.95rem;
            font-family: 'DM Sans', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #0080aa);
            color: #000;
            box-shadow: 0 4px 20px rgba(0, 200, 255, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 28px rgba(0, 200, 255, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
        }

        .btn-secondary:hover {
            background: rgba(0, 200, 255, 0.08);
            transform: translateY(-2px);
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 16px;
            padding: 12px 16px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            border-left: 3px solid var(--muted);
            font-size: 0.88rem;
            color: var(--muted);
            transition: all 0.3s ease;
        }

        .status-bar.loading {
            border-left-color: var(--accent);
            color: var(--accent);
        }

        .status-bar.success {
            border-left-color: var(--success);
            color: var(--success);
        }

        .status-bar.error {
            border-left-color: var(--error);
            color: var(--error);
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid currentColor;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Table */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        thead tr {
            background: rgba(0, 200, 255, 0.07);
        }

        th {
            font-family: 'Space Mono', monospace;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent);
            padding: 14px 20px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 12px 20px;
            border-bottom: 1px solid rgba(26, 45, 80, 0.5);
            color: var(--text);
        }

        tbody tr:last-child td { border-bottom: none; }

        tbody tr {
            transition: background 0.15s ease;
        }

        tbody tr:hover td {
            background: rgba(0, 200, 255, 0.04);
        }

        td:nth-child(2) {
            font-family: 'Space Mono', monospace;
            color: var(--accent);
        }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            background: rgba(0, 200, 255, 0.1);
            color: var(--accent);
            border: 1px solid rgba(0, 200, 255, 0.2);
        }

        .section-title {
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            margin-bottom: 16px;
        }

        #results-section { display: none; }

        /* Row animation */
        tbody tr {
            animation: fadeInUp 0.3s ease both;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div class="logo">
            <div class="satellite-icon">🛰️</div>
            <h1>Starlink Data Scraper</h1>
        </div>
        <p class="subtitle">Extract and analyze daily data usage from your Starlink account</p>
    </header>

    <div class="card">
        <p class="section-title">Controls</p>
        <div class="actions">
            <button class="btn btn-primary" id="scrapeBtn" onclick="startScrape()">
                🔍 Scrape Data
            </button>
            <a href="/download" class="btn btn-secondary">
                ⬇️ Download CSV
            </a>
        </div>
        <div class="status-bar" id="status">
            <span>Ready — click "Scrape Data" to begin.</span>
        </div>
    </div>

    <div id="results-section">
        <div class="card">
            <p class="section-title">
                Results &nbsp;<span class="badge" id="count-badge">0 records</span>
            </p>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Data Usage (GB)</th>
                        </tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    async function startScrape() {
        const btn = document.getElementById("scrapeBtn");
        const status = document.getElementById("status");

        btn.disabled = true;
        status.className = "status-bar loading";
        status.innerHTML = '<div class="spinner"></div><span>Launching browser and logging in to Starlink... this may take 20–40 seconds.</span>';
        document.getElementById("results-section").style.display = "none";

        try {
            const res = await fetch("/scrape");
            const data = await res.json();
            const tbody = document.getElementById("tbody");
            tbody.innerHTML = "";

            if (!data.length || (data.length === 1 && data[0].Date === "Error")) {
                status.className = "status-bar error";
                status.innerHTML = `<span>⚠️ ${data[0]?.["Data Usage (GB)"] || "No data returned."}</span>`;
                btn.disabled = false;
                return;
            }

            data.forEach((row, i) => {
                const tr = document.createElement("tr");
                tr.style.animationDelay = `${i * 30}ms`;
                tr.innerHTML = `<td>${row.Date}</td><td>${row["Data Usage (GB)"]}</td>`;
                tbody.appendChild(tr);
            });

            document.getElementById("count-badge").textContent = `${data.length} record${data.length !== 1 ? 's' : ''}`;
            document.getElementById("results-section").style.display = "block";

            status.className = "status-bar success";
            status.innerHTML = `<span>✅ Successfully scraped ${data.length} records. CSV saved.</span>`;
        } catch (err) {
            status.className = "status-bar error";
            status.innerHTML = `<span>❌ Error: ${err.message}</span>`;
        }

        btn.disabled = false;
    }
</script>
</body>
</html>
